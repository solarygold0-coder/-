name: Signed Windows Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: windows-2022
    env:
      ESIGNER_INSTALL_DIR: C:\Users\runneradmin\eSignerCKA
      ESIGNER_MASTER_KEY: C:\Users\runneradmin\eSignerCKA\master.key
      EXPECTED_PUBLISHER: Mohammed Mousa Asiri
      RELEASE_VERSION: 2.0.0
      ESIGNER_CKA_VERSION: 1.1.2
      ESIGNER_CKA_SHA256: ${{ vars.ESIGNER_CKA_SHA256 }}
      SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
      SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
      SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate signing secrets
        shell: powershell
        run: |
          foreach ($name in @("SSL_COM_USERNAME", "SSL_COM_PASSWORD", "SSL_COM_TOTP_SECRET", "ESIGNER_CKA_SHA256")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required GitHub secret '$name' is missing."
            }
          }

      - name: Build and test
        shell: powershell
        run: .\build-windows.ps1

      - name: Ensure Inno Setup
        shell: powershell
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Install eSigner Cloud Key Adapter
        shell: powershell
        run: |
          $download = "https://github.com/SSLcom/eSignerCKA/releases/download/v$env:ESIGNER_CKA_VERSION/SSL.COM-eSigner-CKA_$env:ESIGNER_CKA_VERSION.zip"
          Invoke-WebRequest -OutFile eSigner_CKA_Setup.zip $download
          $actualHash = (Get-FileHash .\eSigner_CKA_Setup.zip -Algorithm SHA256).Hash
          if ($actualHash -ne $env:ESIGNER_CKA_SHA256.Trim().ToUpperInvariant()) {
            throw "eSigner CKA archive hash mismatch. Expected $env:ESIGNER_CKA_SHA256; got $actualHash."
          }
          Expand-Archive -Force eSigner_CKA_Setup.zip
          Move-Item -Destination "eSigner_CKA_Installer.exe" -Path "eSigner_CKA_*\*.exe"
          New-Item -ItemType Directory -Force -Path $env:ESIGNER_INSTALL_DIR | Out-Null
          Start-Process ".\eSigner_CKA_Installer.exe" -ArgumentList "/CURRENTUSER /VERYSILENT /SUPPRESSMSGBOXES /DIR=`"$env:ESIGNER_INSTALL_DIR`"" -Wait
          Start-Process ".\setup\vc_redist.x86.exe" -ArgumentList "/install /q" -Wait
          Start-Process ".\setup\vc_redist.x64.exe" -ArgumentList "/install /q" -Wait
          & "$env:ESIGNER_INSTALL_DIR\RegisterKSP.exe" | Out-Null
          & "$env:ESIGNER_INSTALL_DIR\eSignerCSP.Config.exe" | Out-Null

      - name: Load verified publisher certificate
        shell: powershell
        run: |
          & "$env:ESIGNER_INSTALL_DIR\eSignerCKATool.exe" config -mode "product" -user $env:SSL_COM_USERNAME -pass $env:SSL_COM_PASSWORD -totp $env:SSL_COM_TOTP_SECRET -key $env:ESIGNER_MASTER_KEY -r
          & "$env:ESIGNER_INSTALL_DIR\eSignerCKATool.exe" unload
          & "$env:ESIGNER_INSTALL_DIR\eSignerCKATool.exe" load

      - name: Sign and verify application files
        shell: powershell
        run: .\sign-windows-artifacts.ps1 -Path .\release\App -Publisher $env:EXPECTED_PUBLISHER

      - name: Build installer from signed files
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\Installer.iss'

      - name: Sign and verify installer
        shell: powershell
        run: .\sign-windows-artifacts.ps1 -Path .\release\تثبيت_نظام_سجلات_المراجعين.exe -Publisher $env:EXPECTED_PUBLISHER

      - name: Create signature report and SHA-256 fingerprints
        shell: powershell
        run: .\new-release-integrity.ps1 -ReleaseDirectory .\release -Publisher $env:EXPECTED_PUBLISHER -ReleaseVersion $env:RELEASE_VERSION

      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: Saudi-Patient-Records-Windows-WPF-SIGNED-v2.0.0
          if-no-files-found: error
          path: |
            release/تثبيت_نظام_سجلات_المراجعين.exe
            release/App/**
            release/SHA256SUMS.txt
            release/SIGNATURE_REPORT.txt
            release/VERSION.txt

      - name: Remove signing session
        if: always()
        shell: powershell
        run: |
          if (Test-Path "$env:ESIGNER_INSTALL_DIR\eSignerCKATool.exe") {
            & "$env:ESIGNER_INSTALL_DIR\eSignerCKATool.exe" unload
          }
          Remove-Item $env:ESIGNER_MASTER_KEY -Force -ErrorAction SilentlyContinue
          Remove-Item .\eSigner_CKA_Setup.zip, .\eSigner_CKA_Installer.exe -Force -ErrorAction SilentlyContinue
