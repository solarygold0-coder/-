name: Windows Standalone EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, v6-clean-rebuild ]
    paths-ignore:
      - "release/**"
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install latest supported .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build, test, and publish one unpackaged EXE
        shell: powershell
        run: .\publish-standalone.ps1

      - name: Capture actual WPF interface at two sizes
        shell: powershell
        run: |
          $large = Join-Path $PWD "release-standalone\Saudi-Patient-Records-v6.0.0-Actual-UI.png"
          $compact = Join-Path $PWD "release-standalone\Saudi-Patient-Records-v6.0.0-Actual-UI-Compact.png"
          $largeProcess = Start-Process ".\release-standalone\Saudi-Patient-Records.exe" -ArgumentList @("--capture-ui", $large, "1440", "900") -Wait -PassThru
          $compactProcess = Start-Process ".\release-standalone\Saudi-Patient-Records.exe" -ArgumentList @("--capture-ui", $compact, "980", "700") -Wait -PassThru
          if ($largeProcess.ExitCode -ne 0 -or $compactProcess.ExitCode -ne 0) { throw "Actual WPF capture failed." }
          foreach ($image in @($large, $compact)) {
            if (-not (Test-Path $image) -or (Get-Item $image).Length -lt 10000) { throw "UI capture is missing or unexpectedly small: $image" }
          }

      - name: Verify deliverable shape
        shell: powershell
        run: |
          $files = @(Get-ChildItem .\release-standalone -File)
          if (-not ($files.Name -contains "Saudi-Patient-Records.exe")) { throw "Standalone EXE is missing." }
          if (Get-ChildItem . -Recurse -File -Include *.msix,*.msixbundle,*.appx,*.msi | Where-Object { $_.FullName -notmatch '\\(bin|obj|upload)\\' }) {
            throw "A packaged installer was unexpectedly produced."
          }
          Get-Content .\release-standalone\BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Saudi-Patient-Records-Standalone-EXE-v6.0.0
          if-no-files-found: error
          compression-level: 0
          path: release-standalone/**
