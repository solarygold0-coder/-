name: Modern WinUI Personal MSIX

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build-test-package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build modern core and run safety tests
        shell: powershell
        run: |
          dotnet restore .\PatientRecordsSaudi.Modern.Tests\PatientRecordsSaudi.Modern.Tests.csproj
          dotnet build .\PatientRecordsSaudi.Modern.Tests\PatientRecordsSaudi.Modern.Tests.csproj -c Release --no-restore
          dotnet run --project .\PatientRecordsSaudi.Modern.Tests\PatientRecordsSaudi.Modern.Tests.csproj -c Release --no-build

      - name: Create personal code-signing certificate
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\PersonalRelease | Out-Null
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=Mohammed Mousa Asiri" `
            -FriendlyName "Mohammed Mousa Asiri - Saudi Patient Records" `
            -KeyAlgorithm RSA `
            -KeyLength 3072 `
            -HashAlgorithm SHA256 `
            -KeyUsage DigitalSignature `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(5) `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Export-Certificate -Cert $cert -FilePath .\PersonalRelease\Mohammed-Mousa-Asiri-Public-Certificate.cer -Type CERT | Out-Null
          Import-Certificate -FilePath .\PersonalRelease\Mohammed-Mousa-Asiri-Public-Certificate.cer -CertStoreLocation "Cert:\CurrentUser\TrustedPeople" | Out-Null
          "PACKAGE_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build digitally signed WinUI 3 MSIX
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found." }
          & $msbuild .\PatientRecordsSaudi.WinUI\PatientRecordsSaudi.WinUI.csproj /restore /t:Build /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=true /p:PackageCertificateThumbprint=$env:PACKAGE_CERT_THUMBPRINT /p:UapAppxPackageBuildMode=SideloadOnly /m
          if ($LASTEXITCODE -ne 0) { throw "WinUI/MSIX build failed." }

      - name: Verify and stage personal installer
        shell: powershell
        run: |
          $package = Get-ChildItem .\PatientRecordsSaudi.WinUI -Recurse -Filter "PatientRecordsSaudi.WinUI*.msix" -File | Select-Object -First 1
          if (-not $package) { throw "No signed MSIX package was produced." }
          $target = ".\PersonalRelease\Saudi-Patient-Records-v3.0.0-x64.msix"
          Copy-Item $package.FullName $target -Force
          $signature = Get-AuthenticodeSignature $target
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -File |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "Microsoft SignTool was not found." }
          $verifyProcess = Start-Process $signtool.FullName -ArgumentList @("verify", "/pa", "/v", $target) -Wait -PassThru -NoNewWindow -RedirectStandardOutput .\signtool-out.txt -RedirectStandardError .\signtool-err.txt
          $verifyExit = $verifyProcess.ExitCode
          $verifyOutput = (Get-Content .\signtool-out.txt -Raw) + (Get-Content .\signtool-err.txt -Raw)
          Write-Host $verifyOutput
          if ($verifyOutput -notmatch "Signature Index: 0" -or $verifyOutput -notmatch "Issued to: Mohammed Mousa Asiri") { throw "Microsoft SignTool did not find the expected MSIX signature." }
          if ($verifyExit -ne 0 -and $verifyOutput -notmatch "root certificate which is not trusted") { throw "Microsoft SignTool rejected the MSIX signature for an unexpected reason." }
          if ($signature.SignerCertificate.Subject -ne "CN=Mohammed Mousa Asiri") { throw "Unexpected signer subject." }
          if (Get-ChildItem .\PersonalRelease -Recurse -Filter "*setup*.exe" -File) { throw "A legacy setup executable was unexpectedly produced." }
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash
          @(
            "Saudi Patient Records v3.0.0"
            "Signer: $($signature.SignerCertificate.Subject)"
            "Certificate thumbprint: $($signature.SignerCertificate.Thumbprint)"
            "MSIX SHA256: $hash"
          ) | Out-File .\PersonalRelease\SIGNATURE-AND-SHA256.txt -Encoding utf8
          @(
            "PERSONAL INSTALLATION - VISIBLE, NOT SILENT"
            "1. Double-click Mohammed-Mousa-Asiri-Public-Certificate.cer."
            "2. Choose Install Certificate > Local Machine > Place all certificates in Trusted People."
            "3. Double-click Saudi-Patient-Records-v3.0.0-x64.msix."
            "4. Review the publisher name and select Install in Windows App Installer."
            "The CER file contains only the public certificate; no private key is distributed."
          ) | Out-File .\PersonalRelease\INSTALL.txt -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: Saudi-Patient-Records-WinUI3-PERSONAL-SIGNED-v3.0.0
          if-no-files-found: error
          path: PersonalRelease/**

      - name: Remove signing certificate from runner
        if: always()
        shell: powershell
        run: |
          if ($env:PACKAGE_CERT_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:PACKAGE_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\TrustedPeople\$env:PACKAGE_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
