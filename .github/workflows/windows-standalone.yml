name: Windows Standalone EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - "release/**"

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install latest supported .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build, test, and publish one unpackaged EXE
        shell: powershell
        run: .\publish-standalone.ps1

      - name: Capture actual WPF interface
        shell: powershell
        run: |
          $image = Join-Path $PWD "release-standalone\Saudi-Patient-Records-v5.2.0-Actual-UI.png"
          $process = Start-Process ".\release-standalone\Saudi-Patient-Records.exe" -ArgumentList @("--capture-ui", $image) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path $image)) { throw "Actual UI screenshot capture failed." }
          if ((Get-Item $image).Length -lt 10000) { throw "Actual UI screenshot is unexpectedly small." }

      - name: Verify deliverable shape
        shell: powershell
        run: |
          $files = @(Get-ChildItem .\release-standalone -File)
          if (-not ($files.Name -contains "Saudi-Patient-Records.exe")) { throw "Standalone EXE is missing." }
          if (Get-ChildItem . -Recurse -File -Include *.msix,*.msixbundle,*.appx,*.msi | Where-Object { $_.FullName -notmatch '\\(bin|obj|upload)\\' }) {
            throw "A packaged installer was unexpectedly produced."
          }
          Get-Content .\release-standalone\BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Saudi-Patient-Records-Standalone-EXE-v5.2.0
          if-no-files-found: error
          compression-level: 0
          path: release-standalone/**
